# Local Supabase project binding. Set to your own project ref, or leave blank to
# use `supabase db push --linked` against a project you link yourself.
project_id = ""

[auth]
additional_redirect_urls = []
site_url = "http://localhost:3000"

[auth.email]
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true
